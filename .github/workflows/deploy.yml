name: Nasazení na Wedos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Stažení kódu
        uses: actions/checkout@v4

      - name: Příprava Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalace závislostí
        run: npm ci

      - name: Sestavení aplikace
        run: npm run build

      - name: Úprava cílové složky
        id: dir
        env:
          TARGET: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          d="${TARGET%/}/"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

      - name: Nahrání na Wedos přes FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: dist/
          server-dir: ${{ steps.dir.outputs.dir }}
